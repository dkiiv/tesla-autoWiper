# Every push / PR: host unit tests + firmware build for both supported chips.
name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6, esp32p4]   # c6 = production module, p4 = bench board
    container: espressif/idf:v5.3.2   # keep in sync with Dockerfile
    env:
      # The firmware has no default CAN bitrate (config.h).  CI builds at the
      # EXPECTED-but-UNCONFIRMED car rate so both targets compile; the
      # artifacts are bench builds, not a validated car image.
      CAN_BITRATE_KBPS: "500"
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build -DCAN_BITRATE_KBPS=$CAN_BITRATE_KBPS set-target ${{ matrix.target }} build
      - uses: actions/upload-artifact@v4
        with:
          # Bench build: the 500 kbit/s car bitrate is UNCONFIRMED.
          name: firmware-${{ matrix.target }}-bench-${{ env.CAN_BITRATE_KBPS }}kbps-UNVERIFIED
          path: |
            build/wiper_controller.bin
            build/wiper_controller.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/flasher_args.json
